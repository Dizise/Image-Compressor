<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <title>Compresor de Imagenes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
    <div class="noise-overlay"></div>
    <div class="grid-lines" aria-hidden="true"></div>

    <button class="sticky-download" id="stickyDownloadBtn">Descargar ZIP</button>

    <main class="container">
        <header class="header fade-in-stagger">
            <div class="header-label">
                <span class="label-dot"></span>
                <span class="label-text">UETS / Comunicacion</span>
            </div>
            <h1 class="hero-title">Compresor<br>de Imagenes</h1>
            <p class="subtitle">Comprime tus imagenes JPEG en lote de forma rapida y sencilla</p>
        </header>

        <div class="status-bar reveal" id="statusBar">
            <div class="counter-group">
                <div class="counter">
                    <span class="counter-value" id="counterUploaded">0000</span>
                    <span class="counter-label">Subidas</span>
                </div>
                <div class="counter-divider"></div>
                <div class="counter">
                    <span class="counter-value" id="counterCompressed">0000</span>
                    <span class="counter-label">Comprimidas</span>
                </div>
                <div class="counter-divider"></div>
                <div class="counter">
                    <span class="counter-value counter-total" id="counterTotal">0000</span>
                    <span class="counter-label">Max</span>
                </div>
            </div>
            <div class="counter-progress">
                <div class="counter-progress-fill" id="counterProgressFill"></div>
            </div>
        </div>

        <section class="upload-zone reveal" id="dropZone" aria-label="Zona de carga de imagenes">
            <div class="upload-icon">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="6" y="12" width="36" height="28" rx="3" stroke="currentColor" stroke-width="2" fill="none"/>
                    <path d="M6 20h36" stroke="currentColor" stroke-width="2"/>
                    <path d="M24 6l-8 8h6v8h4v-8h6l-8-8z" fill="currentColor"/>
                </svg>
            </div>
            <p class="upload-text">Arrastra tus imagenes aqui</p>
            <p class="upload-subtext">o haz clic para seleccionar  /  max. 2000 imagenes JPEG</p>
            <input type="file" id="fileInput" multiple accept="image/jpeg,image/jpg" hidden>
        </section>

        <div class="controls reveal" id="controls" style="display: none;">
            <div class="compression-modes">
                <button class="mode-btn" data-quality="0.8">
                    <span class="mode-label">Baja</span>
                    <span class="mode-value">80%</span>
                </button>
                <button class="mode-btn active" data-quality="0.6">
                    <span class="mode-label">Media</span>
                    <span class="mode-value">60%</span>
                </button>
                <button class="mode-btn" data-quality="0.4">
                    <span class="mode-label">Alta</span>
                    <span class="mode-value">40%</span>
                </button>
            </div>
            <div class="stats" id="stats"></div>
            <p class="batch-info" id="batchInfo" style="display: none;"></p>
            <div class="actions">
                <button class="btn btn-primary" id="compressBtn">Comprimir Todo</button>
                <button class="btn btn-secondary" id="clearBtn">Limpiar</button>
            </div>
        </div>

        <div class="progress-container reveal" id="progressContainer" style="display: none;">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p class="progress-text" id="progressText">0 / 0 imagenes</p>
        </div>

        <div class="images-grid" id="imagesGrid"></div>

        <div class="download-actions" id="downloadActions" style="display: none;">
            <button class="btn btn-success" id="downloadAllBtn">Descargar ZIP</button>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
