<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <title>Convertidor de Archivos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
</head>
<body>
    <div class="noise-overlay"></div>
    <div class="grid-lines" aria-hidden="true"></div>

    <a class="menu-link" href="index.html">← Menu</a>
    <button class="sticky-download" id="stickyDownloadBtn">Descargar ZIP</button>

    <main class="container">
        <header class="header fade-in-stagger">
            <div class="header-label">
                <span class="label-dot"></span>
                <span class="label-text">UETS / Comunicacion</span>
            </div>
            <h1 class="hero-title">Convertidor<br>de Archivos</h1>
            <p class="subtitle">Convierte imagenes entre formatos o extrae el audio de tus videos a MP3</p>
        </header>

        <div class="convert-panel reveal">
            <label class="convert-label" for="convertTarget">Convertir a</label>
            <div class="convert-row">
                <div class="convert-select-wrap">
                    <select id="convertTarget" class="convert-select">
                        <option value="jpg">JPG / JPEG</option>
                        <option value="png">PNG</option>
                        <option value="webp">WEBP</option>
                        <option value="avif">AVIF</option>
                        <option value="mp3">MP3 (audio)</option>
                    </select>
                </div>
                <span class="convert-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
                <span class="convert-hint" id="convertHint">Imagenes: JPG, PNG, WEBP, AVIF, BMP, GIF, HEIC</span>
            </div>
        </div>

        <div id="app"></div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const presetTarget = params.get('to');

        window.TYPE_CONFIG = {
            id: 'convert',
            kind: 'convert',
            accept: '*',
            exts: [],
            outputExt: '',
            preview: false,
            noun: 'archivos',
            selectedText: 'archivos seleccionados',
            modes: [
                { label: 'Baja', value: 0.9, display: '90%' },
                { label: 'Media', value: 0.75, display: '75%' },
                { label: 'Alta', value: 0.6, display: '60%' },
            ],
        };
    </script>
    <script src="app.js"></script>
    <script>
        const convertSelect = document.getElementById('convertTarget');
        const convertHint = document.getElementById('convertHint');
        const HINTS = {
            jpg: 'Imagenes: JPG, PNG, WEBP, AVIF, BMP, GIF, HEIC',
            png: 'Imagenes: JPG, PNG, WEBP, AVIF, BMP, GIF, HEIC',
            webp: 'Imagenes: JPG, PNG, WEBP, AVIF, BMP, GIF, HEIC',
            avif: 'Imagenes: JPG, PNG, WEBP, AVIF, BMP, GIF, HEIC',
            mp3: 'Audio y video: MP3, WAV, OGG, FLAC, M4A, MP4, WEBM, MOV',
        };

        convertSelect.addEventListener('change', () => {
            const t = convertSelect.value;
            window.setConvertTarget(t);
            convertHint.textContent = HINTS[t] || '';
        });

        const initial = (presetTarget && ['jpg', 'png', 'webp', 'avif', 'mp3'].includes(presetTarget)) ? presetTarget : 'jpg';
        convertSelect.value = initial;
        convertHint.textContent = HINTS[initial] || '';
        window.setConvertTarget(initial);
    </script>
</body>
</html>
