<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <title>Compresor ZIP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
    <div class="noise-overlay"></div>
    <div class="grid-lines" aria-hidden="true"></div>

    <a class="menu-link" href="index.html">← Menu</a>
    <button class="sticky-download" id="stickyDownloadBtn">Descargar ZIP</button>

    <main class="container">
        <header class="header fade-in-stagger">
            <div class="header-label">
                <span class="label-dot"></span>
                <span class="label-text">UETS / Comunicacion</span>
            </div>
            <h1 class="hero-title">Compresor<br>de ZIP</h1>
            <p class="subtitle">Agrupa y comprime cualquier tipo de archivo en un ZIP ligero</p>
        </header>
        <div id="app"></div>
    </main>

    <script>
        window.TYPE_CONFIG = {
            id: 'zip',
            kind: 'zip',
            accept: '*',
            exts: [],
            outputExt: 'zip',
            preview: false,
            noun: 'archivos',
            selectedText: 'archivos seleccionados',
            modes: [
                { label: 'Baja', value: 1, display: 'Rapido' },
                { label: 'Media', value: 6, display: 'Balance' },
                { label: 'Alta', value: 9, display: 'Maximo' },
            ],
        };
    </script>
    <script src="app.js"></script>
</body>
</html>
