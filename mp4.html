<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <title>Compresor de MP4</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.min.js"></script>
</head>
<body>
    <div class="noise-overlay"></div>
    <div class="grid-lines" aria-hidden="true"></div>

    <a class="menu-link" href="index.html">← Menu</a>
    <button class="sticky-download" id="stickyDownloadBtn">Descargar ZIP</button>

    <main class="container">
        <header class="header fade-in-stagger">
            <div class="header-label">
                <span class="label-dot"></span>
                <span class="label-text">UETS / Comunicacion</span>
            </div>
            <h1 class="hero-title">Compresor<br>de MP4</h1>
            <p class="subtitle">Comprime tus videos MP4 en H.264 ligero. El primer uso descarga el motor FFmpeg (~32 MB) y la compresion se realiza en tu navegador</p>
        </header>
        <div id="app"></div>
    </main>

    <script>
        window.TYPE_CONFIG = {
            id: 'mp4',
            kind: 'mp4',
            accept: 'video/*,.mp4,.webm,.mov,.m4v,.mkv',
            exts: ['.mp4', '.webm', '.mov', '.m4v', '.mkv'],
            outputExt: 'mp4',
            preview: false,
            noun: 'videos',
            selectedText: 'videos seleccionados',
            modes: [
                { label: 'Baja', value: { crf: 23, abr: 128, maxW: 0, fps: 0 }, display: 'Calidad' },
                { label: 'Media', value: { crf: 28, abr: 96, maxW: 0, fps: 0 }, display: 'Equilibrado' },
                { label: 'Alta', value: { crf: 32, abr: 64, maxW: 720, fps: 24 }, display: 'Maximo' },
            ],
        };
    </script>
    <script src="app.js"></script>
</body>
</html>
